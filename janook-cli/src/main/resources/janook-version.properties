# Filled in by Maven resource filtering at build time — see janook-cli/pom.xml.
# The declared Maven version is the single source of the tool version; nothing restates it in Java.
tool.version=${project.version}

# Read from git at build time. Both fall back to the values declared in janook-cli/pom.xml when
# there is no repository to read — a release tarball, a source zip, a Docker context without .git.
build.commit=${git.commit.id.abbrev}
build.dirty=${git.dirty}
